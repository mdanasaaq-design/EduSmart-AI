name: One-time model artifact refresh

on:
  push:
    branches:
      - automation/refresh-model-artifact-20261018

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerate and validate the 40-tree model
    runs-on: ubuntu-latest
    steps:
      - name: Check out refresh branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install model-training dependencies
        run: python -m pip install --upgrade pip numpy scikit-learn

      - name: Regenerate model artifacts from the canonical training script
        run: python ml/train_model.py

      - name: Run ML contract and export tests
        run: python -m unittest discover -s ml -p 'test_*.py' -v

      - name: Commit artifacts to main and remove this one-time workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/refresh-model-artifact.yml
          git add ml/model.json frontend/public/model.json
          git commit -m "ml: regenerate and synchronize 40-tree model artifacts"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
