name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security tests, lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install temporary Firestore test tooling
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing firebase-tools

      - name: Test Firestore authorization rules
        run: npx firebase emulators:exec --config ../firebase.json --only firestore --project demo-edusmart-ai "node --test tests/firestore.rules.test.js"

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
